    @media (max-width:600px) {

  <script>/* Cornell layout: explicit pairs stay paired; independent arrays stay separate. */
function cornellInline(parent, value) {
  const text = String(value ?? '');
  // A deliberately small, safe emphasis subset. User HTML stays text.
  for (const part of text.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/g)) {
    if (!part) continue;
    const tag = part.startsWith('**') && part.endsWith('**') ? 'strong'
      : part.startsWith('`') && part.endsWith('`') ? 'code' : null;
    if (tag) {
      const node = document.createElement(tag);
      node.textContent = part.slice(tag === 'strong' ? 2 : 1, tag === 'strong' ? -2 : -1);
      parent.append(node);
    } else parent.append(document.createTextNode(part));
  }
}
function addCornellFlashcards(section, body, footer, pairs) {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'cl-mode'; button.dataset.mode = 'card';
  button.textContent = '闪卡';
  section.querySelector('.cl-head').append(button);

  const deck = document.createElement('div');
  deck.className = 'cl-cards';
  const stage = document.createElement('div'); stage.className = 'fc-stage';
  const card = document.createElement('div'); card.className = 'fc-card';
  card.tabIndex = 0; card.setAttribute('role', 'button'); card.title = '点击翻面';
  const front = document.createElement('div'); front.className = 'fc-face fc-front';
  const frontTag = document.createElement('span'); frontTag.className = 'fc-tag'; frontTag.textContent = 'CUE · 问题';
  const frontBody = document.createElement('div'); frontBody.className = 'fc-body'; front.append(frontTag, frontBody);
  const back = document.createElement('div'); back.className = 'fc-face fc-back';
  const backTag = document.createElement('span'); backTag.className = 'fc-tag'; backTag.textContent = 'NOTE · 答案';
  const backBody = document.createElement('div'); backBody.className = 'fc-body'; back.append(backTag, backBody);
  card.append(front, back); stage.append(card);
  const controls = document.createElement('div'); controls.className = 'fc-ops';
  const previous = document.createElement('button'); previous.type = 'button'; previous.textContent = '上一张';
  const count = document.createElement('span'); count.className = 'fc-count';
  const next = document.createElement('button'); next.type = 'button'; next.textContent = '下一张';
  controls.append(previous, count, next); deck.append(stage, controls); section.append(deck);

  const state = { index: 0, flipped: false };
  const fit = () => {
    card.classList.add('measuring');
    const height = Math.max(front.offsetHeight, back.offsetHeight, 180);
    card.classList.remove('measuring');
    card.style.height = `${height}px`;
  };
  const show = () => {
    const pair = pairs[state.index]; frontBody.replaceChildren(); backBody.replaceChildren();
    cornellInline(frontBody, pair.cue); cornellInline(backBody, pair.note);
    state.flipped = false; card.classList.remove('flipped');
    count.textContent = `${state.index + 1} / ${pairs.length}`;
    card.setAttribute('aria-label', '当前显示问题，点击查看答案');
    requestAnimationFrame(fit);
  };
  const flip = () => {
    state.flipped = !state.flipped; card.classList.toggle('flipped', state.flipped);
    card.setAttribute('aria-label', state.flipped ? '当前显示答案，点击查看问题' : '当前显示问题，点击查看答案');
  };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); flip(); } });
  previous.addEventListener('click', () => { state.index = (state.index - 1 + pairs.length) % pairs.length; show(); });
  next.addEventListener('click', () => { state.index = (state.index + 1) % pairs.length; show(); });
  button.addEventListener('click', () => {
    const active = section.classList.toggle('card-mode');
    footer.hidden = active;
    button.textContent = active ? '康奈尔' : '闪卡'; button.dataset.mode = active ? 'cornell' : 'card';
    if (active) show();
  });
}
function renderCornell(parent, value, title = '康奈尔笔记') {
  if (!value || typeof value !== 'object') return;
  const strings = v => (Array.isArray(v) ? v : typeof v === 'string' ? [v] : [])
    .filter(x => typeof x === 'string' && x.trim());
  const pairs = Array.isArray(value.pairs) && value.pairing_status !== 'unpaired'
    ? value.pairs.filter(p => p && typeof p.cue === 'string' && typeof p.note === 'string' && p.cue.trim() && p.note.trim()) : [];
  const cues = strings(value.cues), notes = strings(value.notes ?? value.answers);
  const summary = typeof value.summary === 'string' ? value.summary : '';
  if (!pairs.length && !cues.length && !notes.length && !summary.trim()) return;
  const section = document.createElement('section');
  section.className = 'cornell'; section.setAttribute('aria-label', title);
  const heading = document.createElement('div'); heading.className = 'cl-head';
  const headingText = document.createElement('span'); headingText.className = 'cl-title'; headingText.textContent = 'CORNELL 自测';
  heading.append(headingText); section.append(heading);
  const body = document.createElement('div'); body.className = 'cornell-body';
  function cell(label, values, cls) {
    const box = document.createElement('div'); box.className = 'cornell-cell ' + cls;
    if (label) { const h = document.createElement('h4'); h.textContent = label; box.append(h); }
    if (values.length) {
      const list = document.createElement('ul'); list.className = 'cornell-list';
      for (const text of values) { const item = document.createElement('li'); cornellInline(item, text); list.append(item); }
      box.append(list);
    } else {
      const p = document.createElement('p'); p.className = 'cornell-empty';
      p.textContent = label === '提示 / 自测' ? '本条笔记尚未提供提示。' : '本条笔记尚未提供详细笔记。'; box.append(p);
    }
    return box;
  }
  if (pairs.length) {
    body.classList.add('cornell-paired');
    for (const pair of pairs) {
      const row = document.createElement('div'); row.className = 'cl';
      row.append(cell(null, [pair.cue], 'cornell-cues'), cell(null, [pair.note], 'cornell-notes'));
      body.append(row);
    }
  } else {
    if (cues.length && notes.length) {
      const hint = document.createElement('p'); hint.className = 'cornell-hint';
      hint.textContent = '提示与笔记分别整理，不按序号逐条对应。'; section.append(hint);
    }
    body.append(cell('提示 / 自测', cues, 'cornell-cues'), cell('笔记 / 要点', notes, 'cornell-notes'));
  }
  section.append(body);
  const footer = document.createElement('div'); footer.className = 'cornell-summary';
  const h = document.createElement('h4'); h.textContent = '总结'; footer.append(h);
  const p = document.createElement('p'); cornellInline(p, summary || '本条笔记尚未提供总结。'); footer.append(p);
  section.append(footer);
  if (pairs.length) addCornellFlashcards(section, body, footer, pairs);
  parent.append(section);
}

/* Offline diagrams; all labels are text, never executable markup. */
function renderKnowledgeGraph(parent, value) {
  if (!value || !value.type || value.type === 'none') return;
  const strings = x => Array.isArray(x) ? x.filter(v => typeof v === 'string' && v.trim()) : [];
  const nodes = [...new Set(strings(value.nodes))], relations = strings(value.relations);
  if (!nodes.length && !relations.length) return;
  const make = (tag, text, cls) => { const n=document.createElement(tag); if(text !== undefined)n.textContent=text; if(cls)n.className=cls; return n; };
  parent.append(make('h3','知识图谱'));
  parent.append(make('p','根据学习笔记整理的示意图，非教材原图；来源核验状态见本页内容说明。','compare-hint'));
  if (typeof value.caption === 'string' && value.caption.trim()) parent.append(make('p',value.caption,'compare-hint'));
  const box=make('div',undefined,'knowledge-graph');parent.append(box);
  const keys=['权力高·利益低','权力高·利益高','权力低·利益低','权力低·利益高'];
  if(value.type==='quadrant' && keys.every(k=>nodes.includes(k)) && nodes.length===4) {
    box.append(make('p','权力 ↑ · 利益 →','graph-axis'));
    const grid=make('div',undefined,'graph-quadrants');box.append(grid);
    for(const key of keys) {
      const cell=make('div',undefined,'graph-quadrant');cell.append(make('strong',key));
      for(const r of relations) { const parts=r.split(/\s*→\s*/);if(parts.length===2 && parts[0]===key)cell.append(make('p',parts[1])); }
      grid.append(cell);
    }
  } else if(nodes.length) {
    const edges=[];
    for(const r of relations) {const p=r.split(/\s*→\s*/);if(p.length===2 && nodes.includes(p[0]) && nodes.includes(p[1]))edges.push([nodes.indexOf(p[0]),nodes.indexOf(p[1])]);}
    if(edges.length < relations.length)box.append(make('p',`${relations.length-edges.length} 条关系无法匹配图中节点，未绘制箭头；请展开下方文字说明查看。`,'callout warning'));
    // Topological layers; cycles use a deterministic single-node-per-layer layout.
    const degree=nodes.map(()=>0), levels=nodes.map(()=>0);edges.forEach(([a,b])=>degree[b]++);
    const queue=degree.map((d,i)=>d===0?i:-1).filter(i=>i>=0);let count=0;
    for(let pos=0;pos<queue.length;pos++){const a=queue[pos];count++;for(const [from,b] of edges)if(from===a){levels[b]=Math.max(levels[b],levels[a]+1);if(--degree[b]===0)queue.push(b);}}
    if(count!==nodes.length)nodes.forEach((_,i)=>levels[i]=i);
    const rows=[];nodes.forEach((_,i)=>(rows[levels[i]]??=[]).push(i));
    const lines=nodes.map(n=>{const chars=Array.from(n),out=[];for(let i=0;i<chars.length;i+=12)out.push(chars.slice(i,i+12).join(''));return out;});
    const heights=rows.map(row=>Math.max(...row.map(i=>lines[i].length*22+32)));
    const width=Math.max(440,...rows.map(row=>row.length*210+30));let y=24;const positions=[];
    rows.forEach((row,r)=>{row.forEach((i,j)=>positions[i]={x:(width-row.length*210)/2+j*210+10,y,h:heights[r]});y+=heights[r]+70;});
    const ns='http://www.w3.org/2000/svg';
    const svgNode=(tag,attrs,text)=>{const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs||{}))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n;};
    const svg=svgNode('svg',{viewBox:`0 0 ${width} ${y}`,width,height:y,role:'img','aria-label':'知识节点及有向关系图'});
    svg.append(svgNode('title',{},'知识节点及有向关系图；完整关系见下方文字说明'));
    const defs=svgNode('defs');const marker=svgNode('marker',{id:'knowledge-arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(svgNode('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#5778ab'}));defs.append(marker);svg.append(defs);
    for(const [a,b] of edges){const p=positions[a],q=positions[b],x1=p.x+95,y1=p.y+p.h,x2=q.x+95,y2=q.y;svg.append(svgNode('path',{d:`M ${x1} ${y1} C ${x1} ${y1+35}, ${x2} ${y2-35}, ${x2} ${y2}`,fill:'none',stroke:'#5778ab','stroke-width':2,'marker-end':'url(#knowledge-arrow)'}));}
    nodes.forEach((label,i)=>{const p=positions[i];svg.append(svgNode('rect',{x:p.x,y:p.y,width:190,height:p.h,rx:10,fill:'#eef5ff',stroke:'#87a7d6'}));const text=svgNode('text',{'text-anchor':'middle',fill:'#172033','font-size':15});lines[i].forEach((line,j)=>text.append(svgNode('tspan',{x:p.x+95,y:p.y+28+j*22},line)));svg.append(text);});
    const scroll=make('div',undefined,'graph-scroll');scroll.tabIndex=0;scroll.setAttribute('aria-label','关系图，可横向滚动');scroll.append(svg);box.append(scroll);
  }
  const details=make('details');details.append(make('summary','查看节点与关系文字说明'));
  const list=make('ul');for(const label of [...nodes,...relations])list.append(make('li',label));details.append(list);box.append(details);
}

/* Readable comparison grids, preserving supplied content without invented mnemonics. */
function renderComparisons(parent, concept) {
  const cc=concept.core_concept||{};
  const make=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
  const valid=x=>Array.isArray(x)?x.filter(v=>v && typeof v==='object'):[];
  function section(title, hint) {
    const s=make('section',undefined,'compare-section');s.append(make('h3',title),make('p',hint,'compare-hint'));parent.append(s);return s;
  }
  function table(container, headers, rows) {
    const t=make('table',undefined,'compare-table');const head=make('thead'),tr=make('tr');
    headers.forEach(label=>{const th=make('th',label);th.setAttribute('scope','col');tr.append(th);});head.append(tr);t.append(head);
    const body=make('tbody');
    for(const values of rows){const row=make('tr');values.forEach((value,i)=>{const cell=make(i===0?'th':'td');if(i===0)cell.setAttribute('scope','row');cell.setAttribute('data-label',headers[i]);
      if(i===0)cornellInline(cell,value);else {const lines=String(value||'未提供').split(/；|\n/).filter(x=>x.trim());for(const line of lines){const p=make('p');cornellInline(p,line);cell.append(p);}}
      row.append(cell);});body.append(row);}t.append(body);const scroll=make('div',undefined,'compare-table-scroll');scroll.append(t);container.append(scroll);
  }
  const types=valid(cc.type_comparison);
  if(types.length){
    const s=section('类型对比','先看类型，再横向对照判别方式与关键规则。');
    const groups=new Map();
    for(const item of types){const name=String(item.type||'未命名类型');const parts=name.split(/[:：]/);const group=parts.length===2?parts[0]:'分类速查';const label=parts.length===2?parts[1]:name;if(!groups.has(group))groups.set(group,[]);groups.get(group).push([label,item.syntax_example,item.key_rules]);}
    for(const [name,rows] of groups){s.append(make('h4',name));const hasRules=rows.some(row=>String(row[2]||'').trim());table(s,hasRules?['类型','判别 / 示例','关键规则']:['类型','判别 / 示例'],hasRules?rows:rows.map(row=>row.slice(0,2)));}
  }
  const comparisons=valid(cc.comparisons);
  if(comparisons.length){
    const current=String(concept.title||'当前考点');
    const s=section('易混对比','每行聚焦一个有效维度，直接横向核对概念差异。');
    for(const item of comparisons){
      const compared=String(item.vs||'对比对象');
      const dimensions=valid(item.dimensions).filter(row=>String(row.dimension||'').trim() && (String(row.current||'').trim() || String(row.compared||'').trim()));
      s.append(make('h4',`${current} ↔ ${compared}`));
      if(String(item.commonality||'').trim())table(s,['关系','说明'],[['共同点',item.commonality]]);
      if(dimensions.length){
        table(s,['对比维度',current,compared],dimensions.map(row=>[row.dimension,row.current,row.compared]));
      } else {
        table(s,['对比维度',current,compared],[['综合区别',item.difference||'未提供区别说明','旧内容尚未按对象拆分']]);
      }
    }
  }
}

/* Read-only fidelity sections for fields already produced by the main pipeline.
 * These functions never fetch sources or infer trust. All learner text reaches
 * the DOM through the existing textContent-based helpers. */
function fidelityText(value) {
  if (typeof value === 'string') return value;
  if (!value || typeof value !== 'object') return '';
  return String(value.text || value.title || value.source_id || value.source_file || value.url || '未命名来源');
}

function fidelityList(value) {
  return Array.isArray(value) ? value.filter(item => item !== null && item !== undefined) : [];
}

function renderQuestionTrustWarning(parent, question) {
  const sourceLabel = question.source_paper || question.source_name || question.question_origin;
  if (sourceLabel) callout(parent, '来源题目（输入声明）', String(sourceLabel));
  const generated = question.generated_analysis || {};
  if (question.answer_mismatch || generated.answer_mismatch) {
    callout(parent, '答案存疑', '题库答案与模型辅助判断存在冲突；请提交答案后查看详情，并回到原始题库或来源资料核对。', 'warning');
  }
}

function renderAnswerMismatchDetails(parent, question, generated) {
  const mismatch = generated || question;
  if (!mismatch || !mismatch.answer_mismatch) return;
  const modelAnswer = mismatch.llm_answer || mismatch.answer || mismatch.model_answer || '未提供';
  const prefix = generated ? '模型辅助判断' : '模型判断';
  callout(parent, generated ? '模型生成答案冲突详情' : '答案冲突详情',
    `题库答案为 ${question.answer || '未提供'}；${prefix}为 ${modelAnswer}。请以原始题库或来源资料的复核结果为准。`, 'warning');
}

function renderQuestionLearningDetails(parent, question, titlePrefix = '') {
  const title = value => titlePrefix ? `模型生成${value}` : value;
  const points = fidelityList(question.core_exam_points);
  if (points.length) {
    add(parent, 'h3', title('核心考点'));
    for (const point of points) {
      if (!point || typeof point !== 'object') continue;
      callout(parent, String(point.title || '考点'), String(point.body || point.text || ''));
    }
  }
  const solution = question.calc_solution;
  if (solution && typeof solution === 'object') {
    const parts = [];
    if (solution.method_name) parts.push(`方法：${solution.method_name}`);
    if (solution.steps) parts.push(`步骤：${solution.steps}`);
    if (solution.common_patterns) parts.push(`常见模式：${solution.common_patterns}`);
    if (parts.length) callout(parent, title('计算步骤'), parts.join('\n'));
  }
  const expansions = fidelityList(question.knowledge_expansion);
  if (expansions.length) {
    add(parent, 'h3', title('扩展知识'));
    for (const item of expansions) {
      if (!item || typeof item !== 'object') continue;
      callout(parent, String(item.topic || '扩展要点'), String(item.body || item.text || ''));
    }
  }
  const method = question.method_extract;
  if (method && typeof method === 'object') {
    const parts = [];
    const labels = {method_name: '方法', steps: '步骤', description: '说明', applicable_conditions: '适用条件', common_patterns: '常见模式'};
    for (const key of Object.keys(labels)) {
      if (method[key]) parts.push(`${labels[key]}：${method[key]}`);
    }
    if (parts.length) callout(parent, title('方法论抽取'), parts.join('\n'));
  }
}

function conceptQuestionIds(concept) {
  const origins = fidelityList(concept.question_origins).map(item => typeof item === 'string' ? item : item && item.question_id);
  return [...new Set([...fidelityList(concept.question_ids), ...fidelityList(concept.related_questions), ...fidelityList(concept.source_questions), ...origins].filter(id => typeof id === 'string' && id))];
}

function renderConceptQuestionLinks(parent, concept) {
  const ids = conceptQuestionIds(concept);
  if (!ids.length) return;
  add(parent, 'h3', '关联题目');
  const links = add(parent, 'div', undefined, 'related-question-list');
  for (const id of ids) {
    if (QMAP[id]) links.append(relatedQuestionButton(id, () => { state.view = 'quiz'; state.qid = id; state.search = ''; render(); }));
    else if (typeof CASES !== 'undefined' && CASES.some(c => (c.sub_questions || []).some(q => q.id === id))) links.append(relatedQuestionButton(id, () => { state.view = 'cases'; state.childId = id; render(); }));
    else add(links, 'span', `${id}（不在本学习包）`);
  }
}

function fidelityReferences(value) {
  const seen = new Set();
  return fidelityList(value).flatMap(item => {
    const raw = fidelityText(item);
    const page = item && typeof item === 'object' ? (item.source_page ?? item.page_no ?? item.page) : null;
    const status = item && typeof item === 'object' ? item.verification_status || '' : '';
    const key = JSON.stringify([raw, page, status]);
    if (seen.has(key)) return [];
    seen.add(key);
    const name = raw.replace(/\\/g, '/').split('/').pop().replace(/^sub_[a-z0-9]+_(?:(?:quiz|syllabus)_)?\d+_/, '');
    return [{raw, label: name + (page ? ` · 第 ${page} 页` : '')}];
  });
}

function renderConceptFidelityDetails(parent, concept) {
  const box = add(parent, 'details');
  add(box, 'summary', '查看来源');
  const groups = [
    ['输入提供的来源（未额外核验）', concept.canonical_references],
    ['旧式来源字段（未核验）', concept.references],
    ['模型建议来源（未核验）', concept.unverified_generated_references],
  ];
  let count = 0;
  for (const [title, values] of groups) {
    const rows = fidelityReferences(values);
    if (!rows.length) continue;
    count += rows.length;
    add(box, 'h3', title);
    const list = add(box, 'ul');
    for (const row of rows) {
      const item = add(list, 'li', row.label);
      item.title = row.raw;
    }
  }
  if (count) callout(box, '来源状态', '来源信息按输入保留，未额外核验；旧式字段和模型建议不自动视为可信来源或教辅证据。具体内容请结合原题与教辅原页核对。', 'warning');
  else callout(box, '外部来源', '未提供可追溯的来源；关联题目不等于教材证据。', 'warning');
}

// Only explicitly authored relationships become learning links. Chapter order is not a prerequisite.
function renderConceptLearningLinks(parent, concept) {
  const rel = concept.learning_relations;
  if (!rel || typeof rel !== 'object' || Array.isArray(rel)) return;
  const groups = [['prerequisites','前置知识'], ['related_concepts','关联知识'], ['next_concepts','后续学习']];
  const rows = groups.map(([key,title]) => [title, [...new Set(fidelityList(rel[key]).filter(id => typeof id === 'string' && id && id !== concept.id))]]).filter(([,ids])=>ids.length);
  if (!rows.length) return;
  add(parent,'h3','知识关联与学习路径');
  for (const [title,ids] of rows) {
    add(parent,'h4',title);
    const links=add(parent,'div',undefined,'links');
    for (const id of ids) {
      const target=CMAP[id];
      if (target) links.append(linkButton(target.title||id,()=>{state.view='notes';state.cid=id;state.search='';render();}));
      else add(links,'span',`${id}（不在本学习包）`);
    }
  }
}

function closeMaterialDialog(){
  const dlg=document.querySelector('#material-dialog');
  if(dlg&&dlg.open)dlg.close();
}

function materialPageImage(parent,item,compact=false){
  if(!item.thumbnail)return;
  const frame=add(parent,'span',undefined,'material-page'+(compact?' compact':''));
  image(frame,item.thumbnail,'教辅原版第 '+item.page+' 页');
  const r=item.region;
  if(r&&[r.x,r.y,r.width,r.height].every(Number.isFinite)){
    const mark=add(frame,'span',undefined,'material-region');
    mark.style.left=(r.x*100)+'%';mark.style.top=(r.y*100)+'%';
    mark.style.width=(r.width*100)+'%';mark.style.height=(r.height*100)+'%';
  }
}

function openMaterialDialog(item){
  const dlg=document.querySelector('#material-dialog');
  if(!dlg)return;
  const title=dlg.querySelector('.material-dialog-title');
  const body=dlg.querySelector('.material-dialog-body');
  title.textContent=item.source_title+(item.page?' · 第 '+item.page+' 页':'');
  body.replaceChildren();
  if(item.anchor)add(body,'h3',item.anchor);
  materialPageImage(body,item);
  if(item.snippet)callout(body,'教辅节选',item.snippet);
  if(item.relation||item.status)callout(body,'关联信息',[item.relation,item.status].filter(Boolean).join(' · '));
  const source=document.createElement('a');
  source.className='button primary';
  source.href=item.source_link;
  source.target='_blank';
  source.rel='noopener';
  source.textContent=item.page?'打开原文件第 '+item.page+' 页':'打开原文件';
  body.append(source);
  dlg.showModal();
}

function materialEvidenceCard(item){
  const card=button('',()=>openMaterialDialog(item),'material-card');
  materialPageImage(card,item,true);
  const copy=add(card,'span',undefined,'material-card-copy');
  add(copy,'strong',item.source_title+(item.page?' · 第 '+item.page+' 页':''));
  if(item.anchor)add(copy,'span',item.anchor,'material-anchor');
  if(item.relation||item.status)add(copy,'span',[item.relation,item.status].filter(Boolean).join(' · '),'material-meta');
  if(item.snippet)add(copy,'span',item.snippet,'material-snippet');
  return card;
}

function renderMaterialEvidence(parent,conceptId,evidence){
  const rows=(Array.isArray(evidence)?evidence:[]).filter(x=>x&&x.concept_id===conceptId);
  if(!rows.length)return;
  add(parent,'h3','教辅资料');
  const list=add(parent,'div',undefined,'material-list');
  for(const item of rows)list.append(materialEvidenceCard(item));
}

document.addEventListener('DOMContentLoaded',()=>{
  const dlg=document.querySelector('#material-dialog');
  dlg?.querySelector('.material-dialog-close')?.addEventListener('click',closeMaterialDialog);

on_translations":[{"option":"A","text_zh":"立即跳过评审并冻结全部需求"},{"option":"B","text_zh":"分析干系人的权力、利益和参与度，并制定沟通与参与策略"},{"option":"C","text_zh":"删除该干系人的所有意见"},{"option":"D","text_zh":"只依据项目经理个人经验决定"}],"memory_tips":["先分析、后策略；权力利益参与度，沟通参与不能少。","反对变更先别急，干系分析是前提。","跳过评审、冻结需求、删除意见、只凭经验——都是错误做法。"],"is_calculation":false,"quotes":["应先分析干系人的权力、利益和参与度，再制定沟通与参与策略。"],"is_methodology":true,"option_analyses":[{"option":"A","is_correct":false,"analysis":"❌ 错误。立即跳过评审并冻结全部需求，既不符合变更控制流程，也忽视了关键干系人的合理诉求，可能导致冲突升级和需求失真。项目经理应优先分析干系人并制定参与策略，而不是强制冻结。","quotes":["立即跳过评审并冻结全部需求"]},{"option":"B","is_correct":true,"analysis":"✅ 正确。题库解析明确指出：应先分析干系人的权力、利益和参与度，再制定沟通与参与策略。这符合干系人参与管理的标准做法，也是处理关键干系人持续反对范围变更的首要行动。","quotes":["应先分析干系人的权力、利益和参与度，再制定沟通与参与策略。"]},{"option":"C","is_correct":false,"analysis":"❌ 错误。删除该干系人的所有意见，属于忽视甚至压制干系人诉求的做法。关键干系人的反对可能影响项目资源、验收和支持，项目经理应分析其权力、利益和参与度，并通过沟通与参与策略化解分歧。","quotes":["删除该干系人的所有意见"]},{"option":"D","is_correct":false,"analysis":"❌ 错误。只依据项目经理个人经验决定，缺乏系统的干系人分析和参与规划，容易造成主观决策，无法有效应对关键干系人的持续反对。应基于干系人分析结果制定沟通与参与策略。","quotes":["只依据项目经理个人经验决定"]}],"knowledge_expansion":[{"topic":"权力/利益方格","body":"权力/利益方格根据干系人的权力高低和利益高低划分管理策略：权力高、利益高者重点管理；权力高、利益低者令其满意；权力低、利益高者随时告知；权力低、利益低者监督即可。"},{"topic":"参与度评估矩阵","body":"参与度评估矩阵用于记录干系人当前参与水平与期望参与水平，常见分类包括：不了解、抵制、中立、支持、领导。通过比较差距，制定沟通与参与策略，推动干系人向期望状态转变。"},{"topic":"变更控制流程","body":"范围变更应遵循变更控制流程，包括提出变更申请、分析影响、提交变更控制委员会评审、批准或否决、更新计划和文件、通知干系人等。不能跳过评审，也不能简单冻结全部需求。"}],"error":"","question_translation":"项目关键干系人持续反对范围变更。项目经理首先应采取的做法是："},"llm_answer":"B","source_id":"sample-bank","source_file":"questions.json","answerable":true,"inline_image_assets":[],"unavailable_inline_images":[],"diagram_assets":[],"unavailable_diagrams":[]}],"concepts":[{"id":"cost_performance_index","title":"成本绩效指数（CPI）","parent":"project_cost","chapter":"项目成本管理","source_questions":["fixture_hi_001"],"knowledge_points":[{"id":"fixture_hi_001","statement":"成本绩效指数（CPI）"}],"learning":{"level":2,"estimated_hours":1.5,"path_note":"先掌握挣值管理三参数计划价值（PV）、挣值（EV）、实际成本（AC），再学成本绩效指数计算与判读，最后结合成本偏差、进度绩效指数和完工估算做综合预测。"},"learning_relations":{"prerequisites":[],"next_concepts":["stakeholder_engagement"],"related_concepts":["stakeholder_engagement"]},"relationships":[{"target":"stakeholder_engagement","type":"related","note":"成本绩效数据支撑干系人沟通汇报"}],"one_liner":"衡量项目成本效率的核心挣值指标，反映每元实际花费的挣值产出。","core_concept":{"definition":"成本绩效指数（CPI）是挣值管理中衡量成本效率的相对指标，表示每实际花费1元所获得的挣值。其计算公式为成本绩效指数 = 挣值 ÷ 实际成本，用于判断项目成本是节约、符合预算还是超支。","principle":"挣值管理用同一时点的预算价值与实际花费对比，把成本执行结果转化为可比较的比率。挣值（EV）代表已完成工作的预算价值，实际成本（AC）代表已完成工作的实际花费；二者相除消除项目规模影响，使不同项目或不同阶段的成本效率可比较。成本绩效指数 > 1 说明花小钱办大事，成本绩效指数 < 1 说明花大钱办小事，需分析原因并预测完工成本。","syntax":"\n\n成本绩效指数 = 挣值 ÷ 实际成本\n\n其中：\n- 成本绩效指数：成本效率相对指标，常记为 CPI。\n- 挣值：已完成工作的预算价值，常记为 EV。\n- 实际成本：已完成工作的实际花费，常记为 AC。\n\n判读：成本绩效指数 > 1 成本节约/效率高；成本绩效指数 = 1 符合预算；成本绩效指数 < 1 成本超支/效率低。","rules":["计算规则：成本绩效指数 = 挣值 ÷ 实际成本。","判读规则：成本绩效指数 > 1 表示成本节约、效率高；成本绩效指数 = 1 表示符合预算；成本绩效指数 < 1 表示成本超支、效率低。","含义规则：成本绩效指数表示每实际花费1元所获得的挣值，反映成本效率，不是进度完成百分比。","参数规则：挣值（EV）为已完成工作的预算价值；实际成本（AC）为已完成工作的实际花费；完工预算（BAC）为项目总预算。","关联规则：成本偏差（CV）= 挣值 − 实际成本；成本偏差 > 0 与成本绩效指数 > 1 同向，均表示成本节约。","进度区分规则：没有计划价值（PV）不能计算进度绩效指数（SPI）；完成预算比例通常看 挣值 ÷ 完工预算。","预测规则：仅当当前成本绩效被假定持续至完工时，完工估算 = 完工预算 ÷ 成本绩效指数；在该假定下，本例 完工估算 = 100 ÷ 0.80 = 125 万元。","非典型偏差规则：非典型偏差下不能直接用 完工估算 = 完工预算 ÷ 成本绩效指数，应重新估算剩余工作。"],"comparisons":[{"vs":"成本偏差（CV）","difference":"成本绩效指数是相对比率，反映成本效率；成本偏差是绝对金额，反映超支或节约金额。"},{"vs":"进度绩效指数（SPI）","difference":"成本绩效指数用挣值 ÷ 实际成本衡量成本效率；进度绩效指数用挣值 ÷ 计划价值衡量进度效率。"},{"vs":"完成预算比例（挣值 ÷ 完工预算）","difference":"完成预算比例反映已完成工作的预算占比，成本绩效指数反映实际花费换来的挣值效率，二者不同。"},{"vs":"完工估算（EAC）","difference":"成本绩效指数是当前绩效指标，完工估算是在典型或非典型偏差假设下对最终总成本的预测值。"}],"type_comparison":[]},"best_practices":["定期在固定报告时点计算成本绩效指数与成本偏差（CV），联合判断成本效率与超支金额。","用成本绩效指数趋势分析预测完工估算（EAC），先判断偏差属于典型还是非典型，再选择公式。","当成本绩效指数 < 1 时，优先分析范围、资源、价格、返工等原因，再制定纠偏措施，避免简单压缩质量或范围。"],"visualization":{"type":"flow","nodes":["挣值（EV）","实际成本（AC）","成本绩效指数 = 挣值 ÷ 实际成本","成本绩效指数 > 1：成本节约/效率高","成本绩效指数 = 1：符合预算","成本绩效指数 < 1：成本超支/效率低","若当前成本绩效持续：完工估算 = 完工预算 ÷ 成本绩效指数"],"relations":["挣值（EV） → 成本绩效指数 = 挣值 ÷ 实际成本","实际成本（AC） → 成本绩效指数 = 挣值 ÷ 实际成本","成本绩效指数 = 挣值 ÷ 实际成本 → 成本绩效指数 > 1：成本节约/效率高","成本绩效指数 = 挣值 ÷ 实际成本 → 成本绩效指数 = 1：符合预算","成本绩效指数 = 挣值 ÷ 实际成本 → 成本绩效指数 < 1：成本超支/效率低","成本绩效指数 = 挣值 ÷ 实际成本 → 若当前成本绩效持续：完工估算 = 完工预算 ÷ 成本绩效指数"]},"mnemonic":"CPI看效率：挣值除实际，>1省，<1超。","why_tested":"成本绩效指数是挣值管理中最常考的成本效率指标，考试常给出完工预算、挣值和实际成本要求计算并判读。该知识点还常与成本偏差、进度绩效指数、完工估算等联合考查，检验考生能否区分成本与进度、典型与非典型偏差。","common_mistakes":[{"mistake":"把成本绩效指数（CPI）当作项目完成百分比，认为成本绩效指数 = 0.80 表示只完成80%。","correct":"成本绩效指数反映成本效率，不是进度完成比例；完成预算比例通常看 挣值 ÷ 完工预算。","severity":"high"},{"mistake":"只记住公式却忽略判读方向，认为成本绩效指数 < 1 是成本节约。","correct":"成本绩效指数 > 1 表示成本节约、效率高；成本绩效指数 = 1 表示符合预算；成本绩效指数 < 1 表示成本超支、效率低。","severity":"high"},{"mistake":"在没有计划价值（PV）时强行计算进度绩效指数（SPI）。","correct":"进度绩效指数 = 挣值 ÷ 计划价值，无计划价值不能计算进度绩效指数；仅有挣值和实际成本时只能判断成本绩效，不能判断进度。","severity":"medium"},{"mistake":"典型偏差与非典型偏差混用，直接用 完工估算 = 完工预算 ÷ 成本绩效指数 处理所有情况。","correct":"只有典型偏差即当前成本效率持续时，才用 完工估算 = 完工预算 ÷ 成本绩效指数；非典型偏差需重新估算剩余工作。","severity":"high"}],"aliases":[{"text":"成本绩效指标","type":"synonym"},{"text":"CPI","type":"abbreviation"},{"text":"Cost Performance Index","type":"translation"}],"related_questions":["fixture_hi_001"],"cornell_note":{"cues":["成本绩效指数（CPI）的定义和计算公式是什么？","成本绩效指数 > 1、= 1、< 1 分别代表什么？","挣值（EV）、实际成本（AC）和完工预算（BAC）分别指什么？","成本绩效指数与成本偏差（CV）之间有什么对应关系？","为什么没有计划价值（PV）就不能判断进度绩效？","典型偏差下如何用成本绩效指数预测完工估算（EAC）？"],"notes":["**定义**：成本绩效指数（CPI）是挣值管理中衡量成本效率的相对指标，表示每实际花费1元所获得的挣值，不是进度完成百分比。\n**公式**：**成本绩效指数 = 挣值 ÷ 实际成本**；其中：**挣值（EV）**=已完成工作的预算价值，**实际成本（AC）**=已完成工作的实际花费。","**判读**：**成本绩效指数 > 1** 成本节约、效率高；**成本绩效指数 = 1** 符合预算；**成本绩效指数 < 1** 成本超支、效率低。","**挣值（EV）**：已完成工作的预算价值。\n**实际成本（AC）**：已完成工作的实际花费。\n**完工预算（BAC）**：项目总预算。","**成本偏差（CV）= 挣值 − 实际成本**。当实际成本为正时，成本偏差 > 0 与成本绩效指数 > 1 均表示成本节约；成本偏差 < 0 与成本绩效指数 < 1 均表示成本超支。","**进度绩效指数 = 挣值 ÷ 计划价值**，缺少计划价值（PV）就无法计算。\n**限制**：无 **计划价值（PV）** 不能计算 **进度绩效指数（SPI）**；本例 成本绩效指数 = 60 ÷ 75 = 0.80，成本超支。","**预测**：仅在当前成本绩效被假定持续至完工时，才可用 **完工估算 = 完工预算 ÷ 成本绩效指数**；非典型偏差需重估剩余工作，不能直接套用。"],"pairs":[{"cue":"成本绩效指数（CPI）的定义和计算公式是什么？","note":"**定义**：成本绩效指数（CPI）是挣值管理中衡量成本效率的相对指标，表示每实际花费1元所获得的挣值，不是进度完成百分比。\n**公式**：**成本绩效指数 = 挣值 ÷ 实际成本**；其中：**挣值（EV）**=已完成工作的预算价值，**实际成本（AC）**=已完成工作的实际花费。"},{"cue":"成本绩效指数 > 1、= 1、< 1 分别代表什么？","note":"**判读**：**成本绩效指数 > 1** 成本节约、效率高；**成本绩效指数 = 1** 符合预算；**成本绩效指数 < 1** 成本超支、效率低。"},{"cue":"挣值（EV）、实际成本（AC）和完工预算（BAC）分别指什么？","note":"**挣值（EV）**：已完成工作的预算价值。\n**实际成本（AC）**：已完成工作的实际花费。\n**完工预算（BAC）**：项目总预算。"},{"cue":"成本绩效指数与成本偏差（CV）之间有什么对应关系？","note":"**成本偏差（CV）= 挣值 − 实际成本**。当实际成本为正时，成本偏差 > 0 与成本绩效指数 > 1 均表示成本节约；成本偏差 < 0 与成本绩效指数 < 1 均表示成本超支。"},{"cue":"为什么没有计划价值（PV）就不能判断进度绩效？","note":"**进度绩效指数 = 挣值 ÷ 计划价值**，缺少计划价值（PV）就无法计算。\n**限制**：无 **计划价值（PV）** 不能计算 **进度绩效指数（SPI）**；本例 成本绩效指数 = 60 ÷ 75 = 0.80，成本超支。"},{"cue":"典型偏差下如何用成本绩效指数预测完工估算（EAC）？","note":"**预测**：仅在当前成本绩效被假定持续至完工时，才可用 **完工估算 = 完工预算 ÷ 成本绩效指数**；非典型偏差需重估剩余工作，不能直接套用。"}],"summary":"成本绩效指数是挣值管理的成本效率指标，公式为成本绩效指数 = 挣值 ÷ 实际成本；> 1 节约、= 1 符合、< 1 超支，且不能当作完成百分比。仅在当前成本绩效被假定持续至完工时，可用完工估算 = 完工预算 ÷ 成本绩效指数预测总成本。口诀：CPI看效率，挣值除实际，>1省，<1超。","pairing_status":"paired"},"tags":["项目成本管理","挣值管理","成本绩效指数","CPI","成本控制"],"images":["assets/evm-flow.svg"],"difficulty_level":2,"question_origins":[{"question_id":"fixture_hi_001"}],"canonical_references":[{"question_id":"fixture_hi_001","verification_status":"input_provided","source_file":"questions.json"}],"teaching_evidence_ids":["sample-evidence-cpi"],"teaching_evidence":[{"id":"sample-evidence-cpi","source_id":"sample-guide","source_file":"assets/teaching-sample.pdf","status":"input_provided","relation":"supports","page":1,"snippet":"CPI = EV / AC. When EV=60 and AC=75, CPI=0.80.","region":null}],"image_assets":["assets/content/01a6d1c1aa11.svg"],"unavailable_images":[],"question_ids":["fixture_hi_001"]},{"id":"stakeholder_engagement","title":"干系人参与管理","parent":"project_stakeholder","chapter":"项目干系人管理","source_questions":["fixture_hi_002"],"knowledge_points":[{"id":"fixture_hi_002","statement":"干系人参与管理"}],"learning":{"level":2,"estimated_hours":1.5,"path_note":"先掌握识别干系人与干系人分析的输出，再理解权力/利益方格与参与度评估矩阵，最后结合变更控制流程学习变更场景下的参与策略。"},"learning_relations":{"prerequisites":[],"next_concepts":["cost_performance_index"],"related_concepts":["cost_performance_index"]},"relationships":[{"target":"cost_performance_index","type":"related","note":"需向干系人披露CPI等绩效信息"}],"one_liner":"项目干系人管理中，基于分析制定参与策略，并持续调整以争取支持。","core_concept":{"definition":"项目干系人管理包含识别、规划、管理与监督等相关过程。本概念聚焦其中基于干系人分析结果制定参与策略、与干系人沟通协作、处理关切并监督策略有效性的学习框架。其目的在于提升支持、降低抵制；具体过程名称和教材表述应以目标考试版本为准。","principle":"干系人的参与会显著影响项目获得支持或遭遇阻力。可借助权力/利益方格判断管理优先级，并借助参与度评估矩阵识别当前与期望参与水平的差距，据此制定沟通与参与策略。当关键干系人反对范围变更时，应先分析其权力、利益和参与度，再通过沟通、协商争取支持；具体治理动作应遵循项目已批准的治理机制。","syntax":"模型学习归纳（不是固定教材流程）：识别并更新干系人信息 → 分析权力、利益和参与度 → 制定参与与沟通策略 → 沟通、协作、协商 → 监督效果并更新策略。实际项目的过程名称、顺序与治理要求以目标考试教材和已批准的项目治理机制为准。","rules":["在本题给定的关键干系人反对情境下，先分析其权力、利益和参与度，再制定针对性的沟通与参与策略。","权力/利益方格用于判断干系人管理优先级：权力高且利益高者重点管理；权力高且利益低者令其满意；权力低且利益高者随时告知；权力低且利益低者监督即可。","参与度评估矩阵用于记录干系人当前参与水平与期望参与水平，通过比较差距制定沟通与参与策略。","参与度评估矩阵的常见参与水平分类为：不了解、抵制、中立、支持、领导。","变更管理不能跳过评审，也不能简单冻结需求，更不能删除或忽视干系人意见。","模型学习归纳：范围变更通常需要提出申请、分析影响、按项目治理机制评审和决策、更新相关计划/文件并沟通受影响干系人；实际步骤、角色与审批机制以项目已批准治理要求为准。","直接强制、独断或只凭经验处理干系人冲突，会加剧抵触并降低项目成功概率。"],"comparisons":[{"vs":"识别干系人","difference":"识别干系人回答“谁是干系人”，干系人参与管理回答“如何让干系人有效参与并支持项目”。"},{"vs":"干系人分析","difference":"干系人分析输出权力、利益与参与度判断，干系人参与管理据此制定并执行参与策略。"},{"vs":"规划沟通管理","difference":"沟通管理关注信息正确及时地传递，干系人参与管理关注参与水平与支持态度的转变。"},{"vs":"实施整体变更控制","difference":"变更控制管流程、影响分析与基线更新，干系人参与管理管人的立场与支持度，二者在范围变更场景中配合使用。"}],"type_comparison":[{"type":"权力/利益方格：权力高，利益高","syntax_example":"权力高 × 利益高 → 重点管理","key_rules":"关键干系人，需重点管理、密切沟通、主动争取支持。"},{"type":"权力/利益方格：权力高，利益低","syntax_example":"权力高 × 利益低 → 令其满意","key_rules":"有影响力但关注度低，需保证其满意，避免其因不满而阻挠。"},{"type":"权力/利益方格：权力低，利益高","syntax_example":"权力低 × 利益高 → 随时告知","key_rules":"对项目结果高度关心但影响有限，需及时告信息、保持沟通。"},{"type":"权力/利益方格：权力低，利益低","syntax_example":"权力低 × 利益低 → 监督即可","key_rules":"投入最少精力，保持监督，防止状态变化。"},{"type":"参与度评估矩阵：不了解","syntax_example":"当前参与水平 = 不了解，期望参与水平 = 支持 → 差距：不了解 → 支持","key_rules":"对项目与潜在影响一无所知，需先建立基本认知。"},{"type":"参与度评估矩阵：抵制","syntax_example":"当前参与水平 = 抵制，期望参与水平 = 支持 → 差距：抵制 → 支持","key_rules":"知晓项目但反对，需分析其权力与利益，通过沟通协商化解抵触。"},{"type":"参与度评估矩阵：中立","syntax_example":"当前参与水平 = 中立，期望参与水平 = 支持 → 差距：中立 → 支持","key_rules":"知晓项目但不支持也不反对，可通过参与和沟通争取转为支持。"},{"type":"参与度评估矩阵：支持","syntax_example":"当前参与水平 = 支持，期望参与水平 = 领导 → 差距：支持 → 领导","key_rules":"知晓项目并支持，可进一步培养为领导者。"},{"type":"参与度评估矩阵：领导","syntax_example":"当前参与水平 = 领导，期望参与水平 = 领导 → 差距：无","key_rules":"积极推动项目成功，是项目最重要的支持力量。"}]},"best_practices":["在项目早期就开展干系人识别与分析，并在项目全周期持续更新干系人登记册与参与度评估矩阵。","对权力高、利益高的关键干系人建立定期沟通与主动协商机制，变更前先争取其理解与支持。","定期比较干系人当前参与水平与期望参与水平的差距，据此调整沟通与参与策略。","范围变更严格走变更控制流程，经变更控制委员会评审后再实施，并及时通知受影响干系人。"],"visualization":{"type":"quadrant","nodes":["权力高·利益高","权力高·利益低","权力低·利益高","权力低·利益低"],"relations":["权力高·利益高 → 重点管理","权力高·利益低 → 令其满意","权力低·利益高 → 随时告知","权力低·利益低 → 监督"]},"mnemonic":"先分析后策略；权力利益定优先级，参与度矩阵找差距","why_tested":"项目干系人管理常以情景题考查分析后制定策略的判断顺序，以及权力/利益方格、参与度评估矩阵的工具应用。目标考试的具体过程名称、步骤和出题范围须以对应教材版本为准。","common_mistakes":[{"mistake":"干系人持续反对变更时，直接强制推行或独断决策。","correct":"在题设已知关键干系人的情境下，应先分析其权力、利益和参与度，再制定针对性的沟通与参与策略，通过协商争取支持。","severity":"high"},{"mistake":"为加快进度跳过变更控制评审直接实施范围变更。","correct":"范围变更应按项目已批准的治理机制申请、分析影响、评审和决策；具体角色、步骤和审批要求以项目实际治理与目标教材为准。","severity":"high"},{"mistake":"简单冻结全部需求，或删除、忽视反对干系人的意见。","correct":"应正视干系人利益冲突，通过沟通、参与和协商化解分歧，删除意见只会加剧抵触。","severity":"high"},{"mistake":"混淆权力/利益方格与参与度评估矩阵的用途。","correct":"权力/利益方格用于判断管理优先级，参与度评估矩阵用于识别当前参与水平与期望参与水平的差距。","severity":"medium"},{"mistake":"只凭经验判断干系人态度，不做系统分析。","correct":"应使用干系人登记册、权力/利益方格、参与度评估矩阵等工具进行系统分析与跟踪。","severity":"medium"}],"aliases":[{"text":"干系人参与","type":"synonym"},{"text":"干系人参与管理过程","type":"synonym"},{"text":"Stakeholder Engagement Management","type":"translation"}],"related_questions":["fixture_hi_002"],"cornell_note":{"cues":["干系人参与管理的定义和过程框架是什么？","权力/利益方格四个象限分别对应什么管理策略？","参与度评估矩阵有哪几种参与水平，用来解决什么问题？","干系人持续反对范围变更时，项目经理首先应采取什么做法？","范围变更应遵循的变更控制流程有哪些关键步骤？","干系人参与管理中有哪些必须避免的错误做法？"],"notes":["**定义**：本概念是项目干系人管理中基于分析制定参与策略、沟通协作、处理关切并监督策略有效性的学习框架；具体过程名称以目标考试教材为准。\n**过程框架**：模型学习归纳（非固定教材流程）：识别并更新信息 → 分析（权力/利益方格定优先级，参与度评估矩阵找差距）→ 制定策略 → 沟通、协作、协商 → 监督并更新策略。实际项目以已批准治理机制为准。","**权力/利益方格**：权力高 × 利益高 → 重点管理；权力高 × 利益低 → 令其满意；权力低 × 利益高 → 随时告知；权力低 × 利益低 → 监督。","**参与度评估矩阵**：参与水平分为不了解、抵制、中立、支持、领导；通过比较当前参与水平与期望参与水平的差距制定沟通与参与策略。","**关键规则**：在题设已知关键干系人反对变更时，先分析其权力、利益和参与度，再制定针对性沟通与参与策略；变更不能跳过项目已批准的治理要求，也不能简单冻结需求或删除、忽视干系人意见。","**变更治理**：模型学习归纳为申请、影响分析、按治理机制评审和决策、更新相关文件、沟通受影响干系人；实际步骤、角色和审批要求以项目已批准治理机制和目标教材为准。","**重要限制**：直接强制、独断或只凭经验处理干系人冲突会加剧抵触，降低项目成功概率。\n不能跳过已批准的变更治理要求，也不能简单冻结需求或删除、忽视干系人意见。"],"pairs":[{"cue":"干系人参与管理的定义和过程框架是什么？","note":"**定义**：本概念是项目干系人管理中基于分析制定参与策略、沟通协作、处理关切并监督策略有效性的学习框架；具体过程名称以目标考试教材为准。\n**过程框架**：模型学习归纳（非固定教材流程）：识别并更新信息 → 分析（权力/利益方格定优先级，参与度评估矩阵找差距）→ 制定策略 → 沟通、协作、协商 → 监督并更新策略。实际项目以已批准治理机制为准。"},{"cue":"权力/利益方格四个象限分别对应什么管理策略？","note":"**权力/利益方格**：权力高 × 利益高 → 重点管理；权力高 × 利益低 → 令其满意；权力低 × 利益高 → 随时告知；权力低 × 利益低 → 监督。"},{"cue":"参与度评估矩阵有哪几种参与水平，用来解决什么问题？","note":"**参与度评估矩阵**：参与水平分为不了解、抵制、中立、支持、领导；通过比较当前参与水平与期望参与水平的差距制定沟通与参与策略。"},{"cue":"干系人持续反对范围变更时，项目经理首先应采取什么做法？","note":"**关键规则**：在题设已知关键干系人反对变更时，先分析其权力、利益和参与度，再制定针对性沟通与参与策略；变更不能跳过项目已批准的治理要求，也不能简单冻结需求或删除、忽视干系人意见。"},{"cue":"范围变更应遵循的变更控制流程有哪些关键步骤？","note":"**变更治理**：模型学习归纳为申请、影响分析、按治理机制评审和决策、更新相关文件、沟通受影响干系人；实际步骤、角色和审批要求以项目已批准治理机制和目标教材为准。"},{"cue":"干系人参与管理中有哪些必须避免的错误做法？","note":"**重要限制**：直接强制、独断或只凭经验处理干系人冲突会加剧抵触，降低项目成功概率。\n不能跳过已批准的变更治理要求，也不能简单冻结需求或删除、忽视干系人意见。"}],"summary":"项目干系人管理学习框架的关键是“先分析、后策略”：用权力/利益方格判断管理优先级，用参与度评估矩阵找出参与水平差距，再以沟通协商争取支持。变更治理的具体步骤以目标教材和项目已批准治理机制为准。口诀：先分析后策略；权力利益定优先级，参与度矩阵找差距。","pairing_status":"paired"},"tags":["项目干系人管理","干系人参与","权力/利益方格","参与度评估矩阵","变更控制流程"],"difficulty_level":2,"question_origins":[{"question_id":"fixture_hi_002"}],"canonical_references":[{"question_id":"fixture_hi_002","verification_status":"input_provided","source_file":"questions.json"}],"teaching_evidence_ids":["sample-evidence-stakeholder"],"teaching_evidence":[{"id":"sample-evidence-stakeholder","source_id":"sample-guide","source_file":"assets/teaching-sample.pdf","status":"input_provided","relation":"supports","page":2,"snippet":"Analyze stakeholder power, interest and current engagement before     ? location.pathname.match(/^\/packages\/([a-f0-9]{16})\/web\/index\.html$/) : null;

  const localKey = `quick-pass-study-v1:${DATA.profile?.exam_code || 'default'}:${location.pathname}`;

  function localWrongbook(saved) {
    const answers = saved.answers || {}, bookmarked = new Set(saved.saved_choices || []);
    const dismissed = new Set(saved.dismissed_choices || []);
    const choices = [...new Set([...Object.keys(answers), ...bookmarked])]
      .filter(qid => bookmarked.has(qid) || (!answers[qid]?.ok && !dismissed.has(qid)))
      .filter(qid => QMAP[qid])
      .map(qid => ({kind: 'choice', qid, stem: QMAP[qid].question_zh || qid,
        wrong_count: answers[qid] && !answers[qid].ok ? 1 : 0, picked: answers[qid]?.picked || [], saved: bookmarked.has(qid)}));
    const cases = (saved.case_bookmarks || []).filter(id => CASEMAP[id])
      .map(case_id => ({kind: 'case', case_id, stem: CASEMAP[case_id].original_number || case_id}));
    return [...choices, ...cases];
  }

  function apply(saved) {
    state.answers = Object.assign(Object.create(null), saved.answers || {});
    state.picked = Object.create(null);
    for (const [qid, answer] of Object.entries(state.answers)) {
      if (Array.isArray(answer.picked)) state.picked[qid] = [...answer.picked];
    }
    state.savedChoices = Array.isArray(saved.saved_choices) ? saved.saved_choices : [];
    state.dismissedChoices = Array.isArray(saved.dismissed_choices) ? saved.dismissed_choices : [];
    state.caseBookmarks = Array.isArray(saved.case_bookmarks) ? saved.case_bookmarks : [];
    state.wrongbook = endpoint ? (Array.isArray(saved.wrongbook) ? saved.wrongbook : []) : localWrongbook(saved);
  }

  function saveLocal(saved) {
    localStorage.setItem(localKey, JSON.stringify(saved));
    apply(saved);
  }

  async function changeBookmark(payload) {
    const response = await fetch(endpoint + '/wrongbook', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error('错题本未保存；请确认本地学习库仍在运行');
    apply(await response.json());
  }

  async function load() {
    if (endpoint) {
      const response = await fetch(endpoint + '/progress', {cache: 'no-store'});
      if (!response.ok) throw new Error('本地学习库无法读取作答记录');
      apply(await response.json());
      state.storageStatus = '已连接本地学习库 · 刷新及新学习包继承记录';
      return;
    }
    // Browser treatment of file:// storage differs. Keep this useful for
    // refresh/reopen, but never promise cross-package persistence here.
    const probe = localKey + ':probe';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
    const value = localStorage.getItem(localKey);
    if (value) apply(JSON.parse(value));
    state.storageStatus = '当前为 file:// 单文件模式；若图片或 PDF 未随目录打开，请让 Agent 使用电脑端学习库返回的 http:// 地址';
  }

  async function record(q, picked) {
    if (endpoint) {
      const response = await fetch(endpoint + '/answer', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({qid: q.id, picked}),
      });
      if (!response.ok) throw new Error('作答未保存；请确认本地学习库仍在运行');
      const result = await response.json();
      apply(result);
      return;
    }
    const correct = q.options.filter(x => x.is_correct).map(x => x.label);
    const answers = Object.assign(Object.create(null), state.answers);
    answers[q.id] = {ok: picked.length === correct.length && correct.every(x => picked.includes(x)), picked: [...picked]};
    const dismissed_choices = answers[q.id].ok ? state.dismissedChoices :
      state.dismissedChoices.filter(id => id !== q.id);
    // Save first. A quota/security failure must not be shown as a completed answer.
    saveLocal({answers, saved_choices: state.savedChoices,
      dismissed_choices, case_bookmarks: state.caseBookmarks});
  }

  async function bookmarkChoice(q, save) {
    if (endpoint) return changeBookmark({kind: 'choice', action: save ? 'add' : 'remove', qid: q.id});
    const saved_choices = state.savedChoices.filter(id => id !== q.id);
    if (save) saved_choices.push(q.id);
    const dismissed_choices = save ? state.dismissedChoices.filter(id => id !== q.id) :
      [...new Set([...state.dismissedChoices, q.id])];
    saveLocal({answers: state.answers, saved_choices, dismissed_choices,
      case_bookmarks: state.caseBookmarks});
  }

  async function bookmarkCase(c, save) {
    if (endpoint) return changeBookmark({kind: 'case', action: save ? 'add' : 'remove', case_id: c.id});
    const case_bookmarks = state.caseBookmarks.filter(id => id !== c.id);
    if (save) case_bookmarks.push(c.id);
    saveLocal({answers: state.answers, saved_choices: state.savedChoices,
      dismissed_choices: state.dismissedChoices, case_bookmarks});
  }

  async function removeWrongbook(item) {
    if (endpoint) {
      const payload = item.kind === 'case'
        ? {kind: 'case', action: 'remove', case_id: item.case_id,
          source_package_id: item.source_package_id}
        : {kind: 'choice', action: 'remove', question_key: item.question_key};
      return changeBookmark(payload);
    }
    if (item.kind === 'case') return bookmarkCase({id: item.case_id}, false);
    return bookmarkChoice({id: item.qid}, false);
  }

  function wrongbookKey(item) {
    return item.kind === 'case' ? `case:${item.source_package_id || 'local'}:${item.case_id}` :
      item.question_key || item.history_url || item.qid || item.stem;
  }

  function selectedWrongbook() {
    const entries = state.wrongbook || [];
    const selected = entries.find(item => wrongbookKey(item) === state.wrongKey) || entries[0];
    state.wrongKey = selected ? wrongbookKey(selected) : null;
    return selected;
  }

  function renderWrongbook(parent) {
    const entries = state.wrongbook || [];
    if (!entries.length) {
      add(parent, 'p', '暂无待复习错题。答错的题目会自动出现在这里。', 'muted');
      return;
    }
    add(parent, 'strong', `错题本 · ${entries.length} 题`);
    selectedWrongbook();
    for (const item of entries) {
      const label = item.kind === 'case'
        ? `案例 · ${String(item.stem || item.case_id).slice(0, 28)}`
        : `${item.qid || '历史'} · ${String(item.stem || '').slice(0, 22)}` +
          (item.wrong_count ? `（错 ${item.wrong_count} 次）` : '（已收藏）');
      parent.append(button(label, () => {
        state.wrongKey = wrongbookKey(item);
        render();
      }, wrongbookKey(item) === state.wrongKey ? 'active' : ''));
    }
  }

  return {load, record, bookmarkChoice, bookmarkCase, removeWrongbook,
    selectedWrongbook, renderWrongbook};
})();

async function changeWrongbook(kind, item, save) {
  try {
    if (kind === 'remove') await StudyProgress.removeWrongbook(item);
    else if (kind === 'case') await StudyProgress.bookmarkCase(item, save);
    else await StudyProgress.bookmarkChoice(item, save);
    render();
  } catch (error) {
    const message = error.message || '错题本保存失败';
    state.storageStatus = message;
    if (kind === 'case') state.caseStatus = message;
    render();
  }
}

function wrongbookQuestion(item) {
  return item?.qid && QMAP[item.qid] ? QMAP[item.qid] : null;
}

function wrongbookCase(item) {
  if (item?.kind !== 'case' || !CASEMAP[item.case_id]) return null;
  const current = location.pathname.match(/^\/packages\/([a-f0-9]{16})\/web\/index\.html$/)?.[1];
  return !item.source_package_id || item.source_package_id === current ? CASEMAP[item.case_id] : null;
}

function wrongbookSnapshotImage(item, asset) {
  const packageId = item?.source_package_id;
  if (!/^[a-f0-9]{16}$/.test(packageId || '') ||
      !/^assets\/content\/[A-Za-z0-9._-]+$/.test(asset || '')) return null;
  return `/packages/${packageId}/web/${asset}`;
}

function wrongbookOriginal(parent, src, label, originalFile) {
  if (!src) return;
  const details = add(parent, 'details', undefined, 'question-source-page');
  details.open = false;
  add(details, 'summary', label);
  if (originalFile && originalFile !== src) {
    const link = add(details, 'a', '打开原文件');
    link.href = originalFile; link.target = '_blank'; link.rel = 'noopener';
  }
  const zoom = add(details, 'a');
  zoom.href = src; zoom.target = '_blank'; zoom.rel = 'noopener';
  image(zoom, src, label);
}

function showWrongbookCase(article, item) {
  const current = wrongbookCase(item);
  const c = current || item.snapshot || {};
  add(article, 'h2', c.original_number || item.stem || item.case_id || '案例题');
  add(article, 'p', c.scenario || '', 'question-body');
  if (current) {
    const pageAssets = new Set((current.source_page_assets || []).map(page => page.asset));
    for (const page of current.source_page_assets || [])
      wrongbookOriginal(article, page.asset, `查看原题所在第 ${page.page} 页`,
        current.source_file ? `${current.source_file}#page=${page.page}` : null);
    for (const [index, asset] of (current.diagram_assets || []).entries()) {
      if (pageAssets.has(asset)) continue;
      const isSourceImage = asset === current.source_file;
      wrongbookOriginal(article, asset, isSourceImage ? '查看原题截图' : `查看案例图表 ${index + 1}`);
    }
  } else for (const [index, asset] of (c.images || []).entries()) {
    const src = wrongbookSnapshotImage(item, asset);
    wrongbookOriginal(article, src, `查看历史案例原件 ${index + 1}`);
  }
  for (const child of c.sub_questions || []) {
    const section = add(article, 'section', undefined, 'case-child');
    add(section, 'h3', child.original_number || child.id || '案例子问题');
    add(section, 'p', child.question || '');
    const answer = child.reference_answer || {};
    if (answer.text || child.generated_analysis) {
      const details = add(section, 'details');
      add(details, 'summary', '查看参考答案与解析');
      if (answer.status === 'verified' && answer.text) callout(details, '原题参考答案', answer.text);
      else if (answer.text) callout(details, '答案待核验', answer.text, 'warning');
      if (child.generated_analysis) callout(details, '生成学习解析', child.generated_analysis, 'warning');
    }
  }
  if (current) article.append(button('前往案例题学习', () => {
    state.view = 'cases'; state.caseId = current.id; render();
  }, 'button'));
  else if (item.source_package_id && /^[a-f0-9]{16}$/.test(item.source_package_id)) {
    const link = add(article, 'a', '打开原案例学习包');
    link.href = `/packages/${item.source_package_id}/web/index.html`;
    link.target = '_blank'; link.rel = 'noopener';
  }
}

function renderWrongbookRail(parent) {
  const item = StudyProgress.selectedWrongbook();
  add(parent, 'strong', '本题关联');
  if (!item) {
    add(parent, 'p', '选择左侧错题后查看关联内容。', 'muted');
    return;
  }
  const question = wrongbookQuestion(item);
  const snapshot = item.snapshot || {};
  const caseItem = wrongbookCase(item);
  add(parent, 'h4', '关联考点');
  const ids = [...new Set(question?.concept_ids ||
    (caseItem?.sub_questions || []).flatMap(q => q.concept_ids || []))];
  const concepts = question || caseItem ? ids.map(id => CMAP[id] || {id, title: id}) : snapshot.concepts || [];
  if (!concepts.length) add(parent, 'p', '暂无明确关联考点。', 'muted');
  for (const concept of concepts) {
    if (concept.id && CMAP[concept.id]) parent.append(button(concept.title || concept.id, () => {
      state.view = 'notes'; state.cid = concept.id; render();
    }));
    else add(parent, 'p', concept.title || concept.id || '未命名考点', 'muted');
  }
  add(parent, 'h4', '关联方法');
  const methods = caseItem
    ? [...new Set((caseItem.sub_questions || []).flatMap(q => q.method_ids || []))]
      .map(id => METHODS.find(m => m.id === id) || {id, title: id})
    : question
    ? METHODS.filter(m => ids.some(id => (m.concept_ids || []).includes(id)))
    : snapshot.methods || [];
  if (!methods.length) add(parent, 'p', '暂无明确关联方法。', 'muted');
  for (const method of methods) {
    if (method.id && METHODS.some(m => m.id === method.id)) parent.append(button(method.title || method.id, () => {
      state.view = 'methods'; state.methodId = method.id; render();
    }));
    else add(parent, 'p', method.title || method.id || '未命名方法', 'muted');
  }
}

// Display numbers are positions within a source batch. Stable IDs remain the
// keys for answers, bookmarks, and case progress.
function sourceBatchLabel(item, kind) {
  if (kind === 'quiz' && item.source_url) {
    try {
      const query = new URL(item.source_url).hash.split('?')[1] || '';
      const name = new URLSearchParams(query).get('name');
      if (name) return name;
    } catch (_) { /* fall back to a clearly unclassified group */ }
  }
  if (kind === 'cases') return String(item.original_number || '').replace(/\s*第\d+题.*$/, '').trim();
  return '';
}

function batchParts(label) {
  const match = String(label || '').match(/^(\d{4})年(上半年|下半年)(.*)$/);
  if (!match) return { year: '年份未标注', half: '场次未标注', batch: label || '批次未标注' };
  const tail = match[3].replace(/[-～~]?(持续更新中).*$/, '').trim();
  return { year: match[1] + '年', half: match[2], batch: tail || '未分批' };
}

function groupQuestions(items, kind) {
  const years = new Map(), byId = new Map(), byBatch = new Map();
  for (const item of items) {
    const { year, half, batch } = batchParts(sourceBatchLabel(item, kind));
    if (!years.has(year)) years.set(year, new Map());
    const halves = years.get(year);
    if (!halves.has(half)) halves.set(half, new Map());
    const batches = halves.get(half);
    if (!batches.has(batch)) batches.set(batch, []);
    const group = batches.get(batch);
    group.push(item);
    byId.set(item.id, { year, half, batch, number: group.length, group });
  }
  for (const entry of byId.values()) byBatch.set(entry.group, entry.group.length);
  return { years, byId };
}

const QUIZ_GROUPS = groupQuestions(Q, 'quiz');
const CASE_GROUPS = groupQuestions(CASES, 'cases');
const expandedQuestionGroups = { quiz: new Set(), cases: new Set() };
const collapsedQuestionGroups = { quiz: new Set(), cases: new Set() };

function relatedQuestionInfo(id) {
  const choice = QMAP[id];
  if (choice) {
    const entry = QUIZ_GROUPS.byId.get(id);
    return {
      meta: entry ? `${entry.year}${entry.half} · ${entry.batch} · 第${entry.number}题` : '选择题',
      summary: String(choice.question_zh || choice.question_en || '查看题目').replace(/\s+/g, ' ').trim(),
    };
  }
  const owner = CASES.find(c => c.id === id || (c.sub_questions || []).some(q => q.id === id));
  if (!owner) return null;
  const child = (owner.sub_questions || []).find(q => q.id === id);
  const entry = CASE_GROUPS.byId.get(owner.id);
  const questionNumber = child?.original_number ? ` · ${child.original_number}` : '';
  return {
    meta: entry ? `${entry.year}${entry.half} · ${entry.batch} · 案例第${entry.number}题${questionNumber}` : '案例题',
    summary: String(child?.question || owner.scenario || '查看案例').replace(/\s+/g, ' ').trim(),
  };
}

function renderNotesSidebar(sidebar, keyword) {
  const groups=Object.create(null);
  for (const concept of C) {
    const group = concept.chapter || (/[\u4e00-\u9fff]/.test(concept.parent || '') ? concept.parent : '未分组');
    if (keyword && !(group.includes(keyword) || (concept.title || '').includes(keyword) || (concept.tags || []).join(' ').includes(keyword))) continue;
    (groups[group] ??= []).push(concept);
  }
  if (state.cid !== lastNoteSelection) {
    const selected = C.find(concept => concept.id === state.cid);
    if (selected) {
      const chapter = selected.chapter || (/[\u4e00-\u9fff]/.test(selected.parent || '') ? selected.parent : '未分组');
      collapsedNoteChapters.delete(chapter);
      expandedNoteChapters.add(chapter);
    }
    lastNoteSelection = state.cid;
  }
  for (const [name, list] of Object.entries(groups)) {
    const chapter = add(sidebar, 'details', undefined, 'question-group note-chapter');
    chapter.open = keyword ? true : expandedNoteChapters.has(name) && !collapsedNoteChapters.has(name);
    const summary = add(chapter, 'summary');
    add(summary, 'span', name);
    add(summary, 'small', String(list.length));
    chapter.ontoggle = keyword ? null : () => {
      if (chapter.open) { expandedNoteChapters.add(name); collapsedNoteChapters.delete(name); }
      else { expandedNoteChapters.delete(name); collapsedNoteChapters.add(name); }
    };
    for (const concept of list) chapter.append(button(concept.title || concept.id,
      () => { state.cid = concept.id; render(); }, state.cid === concept.id ? 'active' : ''));
  }

function batchOrder(label) {
  const match = label.match(/第([一二三四五六七八九十\d]+)批/);
  if (!match) return 0;
  const value = match[1];
  const number = Number(value);
  if (Number.isInteger(number)) return number;
  return '一二三四五六七八九十'.indexOf(value) + 1;
}

function renderGroupedSidebar(sidebar, kind, search) {
  const groups = kind === 'quiz' ? QUIZ_GROUPS : CASE_GROUPS;
  const selectedId = kind === 'quiz' ? state.qid : state.caseId;
  const expanded = expandedQuestionGroups[kind];
  const collapsed = collapsedQuestionGroups[kind];
  const keyword = String(search || '').trim();
  const makeBranch = (parent, title, path, count, selected, visible) => {
    const details = add(parent, 'details', undefined, 'question-group');
    const key = groupKey(path);
    details.open = keyword ? visible : (expanded.has(key) || selected) && !collapsed.has(key);
    const summary = add(details, 'summary');
    add(summary, 'span', title);
    add(summary, 'small', String(count));
    details.ontoggle = keyword ? null : () => {
      if (details.open) { expanded.add(key); collapsed.delete(key); }
      else { expanded.delete(key); collapsed.add(key); }
    };
    return details;
  };
  const years = [...groups.years.entries()].sort((a, b) => b[0].localeCompare(a[0], 'zh-CN'));
  let matches = 0;
  for (const [year, halves] of years) {
    const halfRows = [];
    for (const [half, batches] of [...halves.entries()].sort((a, b) => (a[0] === '上半年' ? -1 : 1) - (b[0] === '上半年' ? -1 : 1))) {
      const batchRows = [];
      for (const [batch, items] of [...batches.entries()].sort((a, b) => batchOrder(a[0]) - batchOrder(b[0]) || a[0].localeCompare(b[0], 'zh-CN'))) {
        const shown = items.filter((item, index) => !keyword ||
          groupedQuestionTitle(item, index + 1, kind).includes(keyword) ||
          `${year}${half}${batch}`.includes(keyword));
        if (shown.length) batchRows.push({ batch, items, shown });
      }
      if (batchRows.length) halfRows.push({ half, batches: batchRows });
    }
    if (!halfRows.length) continue;
    const yearCount = [...halves.values()].flatMap(b => [...b.values()]).reduce((n, list) => n + list.length, 0);
    const yearSelected = groups.byId.get(selectedId)?.year === year;
    const yearNode = makeBranch(sidebar, year, [year], yearCount, yearSelected, true);
    for (const { half, batches } of halfRows) {
      const halfCount = [...halves.get(half).values()].reduce((n, list) => n + list.length, 0);
      const halfSelected = yearSelected && groups.byId.get(selectedId)?.half === half;
      const halfNode = makeBranch(yearNode, half, [year, half], halfCount, halfSelected, true);
      for (const { batch, items, shown } of batches) {
        const batchSelected = halfSelected && groups.byId.get(selectedId)?.batch === batch;
        const batchNode = makeBranch(halfNode, batch, [year, half, batch], items.length, batchSelected, true);
        shown.forEach(item => {
          const number = groups.byId.get(item.id).number;
          const label = groupedQuestionTitle(item, number, kind);
          const open = kind === 'quiz'
            ? () => { state.qid = item.id; render(); }
            : () => openCase(item.id);
          batchNode.append(button(label, open, 'grouped-question ' + (item.id === selectedId ? 'active' : '')));
          matches++;
        });
      }
    }
  }
  if (!matches) add(sidebar, 'p', '没有匹配的题目。', 'muted');
}

function showQuiz(){const q=QMAP[state.qid],out=$('#content');out.replaceChildren();const a=el('article');out.append(a);add(a,'h2','第'+(QUIZ_GROUPS.byId.get(q.id)?.number||1)+'题');add(a,'p',q.question_zh||q.question_en||'');renderQuestionTrustWarning(a,q);source(a,q);a.append(button(state.savedChoices.includes(q.id)?'取消收藏':'收藏进错题本',()=>changeWrongbook('choice',q,!state.savedChoices.includes(q.id)),'button'));for(const p of q.diagram_assets||[])image(a,p,'题目图表');if((q.unavailable_diagrams||[]).length)callout(a,'资源不可用','以下题图/表格没有复制到学习包：'+q.unavailable_diagrams.join('；'),'warning');const picked=state.picked[q.id]||[],done=state.answers[q.id];const opts=add(a,'div',undefined,'options');for(const o of q.options){const b=button(o.label+' · '+o.text,()=>{if(done||!q.answerable)return;const multi=q.options.filter(x=>x.is_correct).length>1;if(multi){const i=picked.indexOf(o.label);i<0?picked.push(o.label):picked.splice(i,1)}else{picked.splice(0,picked.length,o.label)}state.picked[q.id]=picked;render()},'option '+(picked.includes(o.label)?'selected ':'')+(done?(o.is_correct?'ok':picked.includes(o.label)?'bad':''):''));opts.append(b)}if(!q.answerable)callout(a,'不可作答','来源题目缺少选项或确定答案；已保留为阅读材料，未猜测答案。','warning');else if(!done)a.append(button('提交答案',()=>answer(q),'button primary'));add(a,'h3','关联考点');const links=add(a,'div',undefined,'links');for(const cid of q.concept_ids||[])links.append(linkButton(CMAP[cid]?.title||cid,()=>{state.view='notes';state.cid=cid;render()}));if(done){callout(a,done.ok?'答对':'答错',done.ok?'本题已答对。':'已保存到持久错题本，可从本地学习库跨包复习。',done.ok?'':'error');a.append(button('重做本题',()=>{delete state.answers[q.id];delete state.picked[q.id];render()},'button'));callout(a,'题库解析原文',q.explanation);if(q.answer_mismatch)renderAnswerMismatchDetails(a,q);if(Array.isArray(q.option_analyses)&&q.option_analyses.length){add(a,'h3','已有选项分析');for(const x of q.option_analyses){callout(a,(x.option||'')+(x.is_correct?' ✓':' ✗'),x.analysis||'');if(Array.isArray(x.quotes)&&x.quotes.length)callout(a,'引用摘录',x.quotes.join(String.fromCharCode(10)))}}renderQuestionLearningDetails(a,q);textList(a,'已有记忆辅助',q.memory_tips);const cn=q.cornell_note||{},ga=q.generated_analysis||{};if(cn.cues||cn.notes||cn.pairs){if(!sameStructuredValue(cn,ga.cornell_note))renderCornell(a,cn,'题库康奈尔笔记')}if(Object.keys(ga).length){add(a,'h3','模型生成辅助解释');callout(a,'模型说明','以下内容由模型生成，用于学习辅助，不是题库原解析。','warning');renderAnswerMismatchDetails(a,q,ga);callout(a,'模型解释',ga.explanation||ga.analysis);if(Array.isArray(ga.option_analyses))for(const x of ga.option_analyses)callout(a,'模型选项 '+(x.option||''),x.analysis||'');renderQuestionLearningDetails(a,ga,'模型生成');textList(a,'模型记忆辅助',ga.memory_tips);renderCornell(a,ga.cornell_note,'模型辅助康奈尔笔记')}}}
function showWrongbook(){showWrongbookBody()}
function render(){if(state.view==='cases')selectedCase();if(state.view==='methods')selectedMethod();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===state.view));sidebar();state.view==='notes'?showNote():state.view==='wrongbook'?showWrongbook():state.view==='cases'?showCases():state.view==='methods'?showMethods():showQuiz();stats()}
const _rawShowNote=showNote;showNote=function(){if(!CMAP[state.cid]){const out=$('#content');out.replaceChildren();const a=add(out,'article');add(a,'h2','暂无考点笔记');add(a,'p','此学习包当前仅包含案例题或方法卡。','muted');return}_rawShowNote()};

showQuiz=function(){_showQuiz();const q=QMAP[state.qid],article=$('#content article');if(!q)return;const group=QUIZ_GROUPS.byId.get(q.id),batch=group?.group||Q,qi=group?group.number-1:Q.findIndex(x=>x.id===q.id);const submit=[...article.querySelectorAll('button')].find(b=>b.textContent==='提交答案');if(submit)submit.disabled=!(state.picked[q.id]||[]).length;const bar=el('div',undefined,'qbar');bar.append(el('span',(qi+1)+' / '+batch.length+' · '+(group?.year||'')+(group?.half||'')+' '+(group?.batch||'')));const track=el('div',undefined,'track'),fill=el('i');fill.style.width=((qi+1)/batch.length*100)+'%';track.append(fill);bar.append(track);article.prepend(bar);const nav=el('div',undefined,'links');if(qi>0)nav.append(button('上一题',()=>{state.qid=batch[qi-1].id;render()},'button'));if(qi<batch.length-1)nav.append(button('下一题',()=>{state.qid=batch[qi+1].id;render()},'button'));article.append(nav);const dots=el('div',undefined,'qnav');batch.forEach((x,i)=>dots.append(button(String(i+1),()=>{state.qid=x.id;render()},i===qi?'current':'')));article.append(dots);const para=article.querySelector('p');if(para){const block=el('div',undefined,'question-body');markdown(block,q.question_zh||q.question_en||'',q.inline_image_assets||[]);para.replaceWith(block)}};
const _showNote=showNote;showNote=function(){_showNote();const c=CMAP[state.cid],a=$('#content article');if(!c)return;callout(a,'内容说明','考点笔记用于学习辅助；事实应以题库及输入中提供的来源为准。','warning');const relatedMethods=METHODS.filter(m=>(m.concept_ids||[]).includes(c.id));if(relatedMethods.length){add(a,'h3','关联方法');const links=add(a,'div',undefined,'links');for(const m of relatedMethods)links.append(linkButton(m.title||m.id,()=>{state.view='methods';state.methodId=m.id;render()}));}};
const _render=render;render=function(){_render();rail();const status=(state.view==='cases'||state.view==='methods')?state.caseStatus:state.storageStatus;$('#storage-status').title=status||'';$('#save-warning').textContent=/(失败|无法|未保存|不可用|单文件模式)/.test(status||'')?' · '+status:''};
